<script>
// KAVKAZ RP — звук СГУ «Хазард 7007». всё синтезируется (WebAudio), файлов и чужих записей нет.
// цепочка: генераторы → «рупор» (перегруз + полоса 350–3000 Гц) → громкость → панорама → общий компрессор.
const ctx = new (window.AudioContext || window.webkitAudioContext)();
const BASE = 0.38;

const comp = ctx.createDynamicsCompressor();
comp.threshold.value = -14; comp.ratio.value = 6;
const master = ctx.createGain(); master.gain.value = 1;
comp.connect(master); master.connect(ctx.destination);

function shaperCurve(k) {
  const n = 1024, c = new Float32Array(n);
  for (let i = 0; i < n; i++) { const x = i * 2 / n - 1; c[i] = (1 + k) * x / (1 + k * Math.abs(x)); }
  return c;
}
const CURVE = shaperCurve(0.5); // лёгкая «рупорная» окраска, без жужжания

// отражения от улицы: короткий «зал» 0.9 с, генерируется (без записей)
const room = ctx.createConvolver();
room.buffer = (() => {
  const len = Math.floor(ctx.sampleRate * 0.9), b = ctx.createBuffer(2, len, ctx.sampleRate);
  for (let ch = 0; ch < 2; ch++) {
    const d = b.getChannelData(ch);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3.2) * (i < 220 ? i / 220 : 1);
  }
  return b;
})();
const roomGain = ctx.createGain(); roomGain.gain.value = 0.22;
room.connect(roomGain); roomGain.connect(comp);

function chain(vol, pan, band = 1500) {
  const input = ctx.createGain(); input.gain.value = 0.8;
  const sh = ctx.createWaveShaper(); sh.curve = CURVE;
  const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 300;
  const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 6000;
  const out = ctx.createGain(); out.gain.value = vol * BASE;
  const p = ctx.createStereoPanner(); p.pan.value = pan;
  input.connect(sh); sh.connect(hp); hp.connect(lp); lp.connect(out); out.connect(p); p.connect(comp); p.connect(room);
  return { input, out, pan: p };
}

// тембр настоящего «Хазард 7007»: почти чистый тон, 2-я и 3-я гармоники ~ в 10–13 раз тише (сняты со спектра записи)
const HARM = [0, 1, 0.13, 0.05, 0.04, 0.012, 0.015, 0.01, 0.01, 0.008, 0.006];
const WAVE = ctx.createPeriodicWave(new Float32Array(HARM.length), new Float32Array(HARM));

// генератор: тон с тембром настоящего СГУ (WAVE) или заданной формы, общая частота (offset) и «ворота» (gate)
function voice(vol, pan, opts = {}) {
  const c = chain(vol, pan, opts.band);
  const gate = ctx.createGain(); gate.gain.value = 1; gate.connect(c.input);
  const f = ctx.createConstantSource(); f.offset.value = opts.freq || 800;
  const oscs = [];
  for (const d of (opts.detune || [0])) {
    const o = ctx.createOscillator();
    if (opts.type) o.type = opts.type; else o.setPeriodicWave(WAVE);
    o.frequency.value = 0; o.detune.value = d;
    f.connect(o.frequency); o.connect(gate); o.start(); oscs.push(o);
  }
  f.start();
  return { c, gate: gate.gain, f: f.offset, nodes: [f, ...oscs] };
}

function stopVoice(v, t = ctx.currentTime) {
  v.stopped = true; if (v.timer) clearInterval(v.timer);
  v.c.out.gain.cancelScheduledValues(t);
  v.c.out.gain.setTargetAtTime(0, t, 0.03);
  for (const n of v.nodes) { try { n.stop(t + 0.2); } catch (e) {} }
}

// один «кряк»: резкий взлёт и падение тона (start — время начала)
function quackShape(v, t, hi = 1800, lo = 560, len = 0.24) {
  v.f.setValueAtTime(hi * 0.9, t);
  v.f.linearRampToValueAtTime(hi, t + 0.02);
  v.f.exponentialRampToValueAtTime(lo, t + len);
  v.gate.setValueAtTime(0, t);
  v.gate.linearRampToValueAtTime(1, t + 0.008);
  v.gate.setValueAtTime(1, t + len - 0.03);
  v.gate.linearRampToValueAtTime(0, t + len);
}

// мелодии: функция расписывает один цикл с момента t и возвращает его длину (с).
// всё снято со спектра записи настоящего «Хазард 7007» (видео основателя от «Элект», 11.11.2026, шаг 1–3 мс):
//   трель: 1260 и 810 Гц сменяются каждые 28 мс; вой: 1650 → 500 Гц за 3.3 с и обратно; крякалка: 1450 → 520 за 0.16 с, вверх 0.13 с;
//   кряк: взлёт за 0.05 с и спад 0.33 с (860 → 560 Гц); фирменный цикл: взлёт 560→1450, трель, спад, взлёт, «дрожь» наверху, трель, спад.
const TUNE = {
  trill: { hi: 1260, lo: 810, step: 0.028 },
  wail: { lo: 500, hi: 1650, up: 3.3, down: 3.3 },
  yelp: { lo: 520, hi: 1450, down: 0.16, up: 0.13, top: 0.02 },
  quack: { from: 520, peak: 860, end: 560, rise: 0.05, fall: 0.33 },
  horn: 385,
  manual: { from: 520, max: 1650, riseTau: 1.2, fallTau: 0.6, floor: 530 },
};
function trill(v, t, dur) {
  const r = TUNE.trill; let s = t, hi = true;
  while (s < t + dur - 1e-6) { v.f.setValueAtTime(hi ? r.hi : r.lo, s); hi = !hi; s += r.step; }
}
// «кряк» как у настоящего: резкий взлёт и спад вниз
function quackDip(v, t, k = 1) {
  const q = TUNE.quack;
  v.f.setValueAtTime(q.from * k, t);
  v.f.exponentialRampToValueAtTime(q.peak * k, t + q.rise);
  v.f.exponentialRampToValueAtTime(q.end * k, t + q.rise + q.fall);
  v.gate.setValueAtTime(0, t);
  v.gate.linearRampToValueAtTime(1, t + 0.008);
  v.gate.setValueAtTime(1, t + q.rise + q.fall - 0.03);
  v.gate.linearRampToValueAtTime(0, t + q.rise + q.fall);
  return q.rise + q.fall;
}
const TONES = {
  wail(v, t) { const w = TUNE.wail; v.gate.setValueAtTime(1, t); v.f.setValueAtTime(w.hi, t); v.f.linearRampToValueAtTime(w.lo, t + w.down); v.f.linearRampToValueAtTime(w.hi, t + w.down + w.up); return w.up + w.down; },
  yelp(v, t) { const y = TUNE.yelp; v.gate.setValueAtTime(1, t); v.f.setValueAtTime(y.hi, t); v.f.linearRampToValueAtTime(y.lo, t + y.down); v.f.linearRampToValueAtTime(y.hi, t + y.down + y.up); return y.down + y.up + y.top; },
  phaser(v, t) { v.gate.setValueAtTime(1, t); trill(v, t, 1.12); return 1.12; },   // трель «Хазарда» без взлётов
  hilo(v, t) { v.gate.setValueAtTime(1, t); v.f.setValueAtTime(1260, t); v.f.setValueAtTime(810, t + 0.5); return 1.0; },
  pulse(v, t) {
    for (let i = 0; i < 4; i++) {
      const s = t + i * 0.2;
      v.f.setValueAtTime(i % 2 ? 1150 : 1300, s);
      v.gate.setValueAtTime(1, s); v.gate.setValueAtTime(0, s + 0.12);
    }
    return 0.8;
  },
  horn(v, t) { v.gate.setValueAtTime(1, t); v.f.setValueAtTime(TUNE.horn, t); return 1.0; },
  krya(v, t) { const a = quackDip(v, t); const b = quackDip(v, t + a + 0.04); v.gate.setValueAtTime(0, t + a + b + 0.04); return a + b + 0.3; },
  // фирменный цикл «Хазарда» — повторяет первые 3.5 с записи: «ступеньки» вверх, дрожь наверху, трель, спад
  hazard(v, t) {
    let s = t;
    v.gate.setValueAtTime(1, s);
    for (const lv of [560, 760, 900, 1050, 1200, 1330]) {                 // 6 ступенек за ~1 с: рывок вверх и чуть вниз
      v.f.setValueAtTime(lv * 0.93, s); v.f.exponentialRampToValueAtTime(lv * 1.04, s + 0.035); v.f.exponentialRampToValueAtTime(lv, s + 0.165); s += 0.165;
    }
    v.f.exponentialRampToValueAtTime(1450, s + 0.05); s += 0.05;
    for (let i = 0; i < 5; i++) { v.f.setValueAtTime(1455, s); v.f.linearRampToValueAtTime(1385, s + 0.08); v.f.linearRampToValueAtTime(1455, s + 0.165); s += 0.165; } // дрожь
    trill(v, s, 1.2); s += 1.2;                                              // трель 1260/810
    v.f.setValueAtTime(1450, s); v.f.exponentialRampToValueAtTime(820, s + 0.45); s += 0.45; // спад
    return s - t;
  },
};
const OPTS = {
  horn: { type: 'square', detune: [0, 1200, 1902] }, // гудок: тон, октава (770 Гц) и квинта — нарочно «жёсткий», как пневмосигнал
};

const loops = new Map(); // id -> { v, tone, next }

// записи настоящих СГУ: html/sounds/<мелодия>.ogg и quack.ogg. если файла нет — звучит синтез
// 12.11: записи с видео оказались 8 кГц (телефонное качество) — хрипели и щёлкали на стыках. по умолчанию звучит синтез,
// он снят со спектра той же записи и зациклен без швов. вернуть записи: USE_SAMPLES = true
const USE_SAMPLES = false;
const SAMPLES = {};
if (USE_SAMPLES) for (const id of ['quack', ...Object.keys(TONES)]) {
  const load = (ext) => fetch('sounds/' + id + '.' + ext).then(r => r.ok ? r.arrayBuffer() : null)
    .then(b => b && ctx.decodeAudioData(b)).then(buf => { if (buf) SAMPLES[id] = buf; return !!buf; }).catch(() => false);
  load('ogg').then(ok => { if (!ok) load('wav'); });
}

// 11.11: записи короткие (0,3–7 с) — простой loop давал щелчок на стыке. теперь копии идут внахлёст с плавным
// переходом (кроссфейд), и громкость без перегруза (было ×1,6 — хрипело в компрессоре)
const XF = 0.06; // перекрытие копий, с
function sampleVoice(buf, vol, pan, loop) {
  const out = ctx.createGain(); out.gain.value = vol * BASE * 1.15;
  const p = ctx.createStereoPanner(); p.pan.value = pan;
  out.connect(p); p.connect(comp);
  const v = { c: { out, pan: p }, nodes: [], sample: true };
  const play = (t) => {
    const g = ctx.createGain();
    const src = ctx.createBufferSource(); src.buffer = buf;
    src.connect(g); g.connect(out);
    const len = buf.duration, xf = loop ? Math.min(XF, len / 4) : 0;
    if (xf > 0) {
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(1, t + xf);
      g.gain.setValueAtTime(1, t + len - xf); g.gain.linearRampToValueAtTime(0, t + len);
    }
    src.start(t);
    v.nodes.push(src);
    if (v.nodes.length > 4) v.nodes.shift();
    if (loop) v.next = t + len - xf;
  };
  play(ctx.currentTime + 0.01);
  if (loop) {
    v.timer = setInterval(() => {
      if (v.stopped) return clearInterval(v.timer);
      while (v.next < ctx.currentTime + 0.3) play(v.next);
    }, 50);
  }
  return v;
}

function startLoop(id, tone, vol, pan) {
  if (SAMPLES[tone]) { loops.set(id, { v: sampleVoice(SAMPLES[tone], vol, pan, true), tone, next: Infinity }); return; }
  const v = voice(vol, pan, OPTS[tone]);
  v.gate.setValueAtTime(0, ctx.currentTime);
  loops.set(id, { v, tone, next: ctx.currentTime + 0.02 });
}

function stopLoop(id) {
  const l = loops.get(id);
  if (!l) return;
  stopVoice(l.v);
  loops.delete(id);
}

// планировщик: расписываем мелодии на 0.4 с вперёд
setInterval(() => {
  const ahead = ctx.currentTime + 0.4;
  for (const l of loops.values()) {
    let guard = 0;
    if (l.v.sample) continue;
    while (l.next < ahead && guard++ < 64) l.next += TONES[l.tone](l.v, l.next);
  }
}, 60);

function quack(vol, pan) {
  if (SAMPLES.quack) { sampleVoice(SAMPLES.quack, vol, pan, false); return; }
  const v = voice(vol, pan, { freq: TUNE.quack.from });
  v.gate.setValueAtTime(0, ctx.currentTime);
  const t = ctx.currentTime + 0.01;
  const len = quackDip(v, t);
  for (const n of v.nodes) n.stop(t + len + 0.1);
}

// ручной режим (кнопка MAN): пока держишь — тон растёт к потолку, отпустил — плавно падает и затихает
const manual = new Map(); // id -> { v, on }
function manualSet(id, on, vol, pan) {
  const m = TUNE.manual;
  const t = ctx.currentTime;
  let x = manual.get(id);
  if (!x) {
    if (!on) return;
    const v = voice(vol, pan, { freq: m.from });
    v.gate.setValueAtTime(1, t);
    x = { v, on: false };
    manual.set(id, x);
  }
  x.v.c.out.gain.setTargetAtTime(vol * BASE, t, 0.05);
  x.v.c.pan.pan.setTargetAtTime(pan, t, 0.05);
  if (on === x.on) return;
  x.on = on;
  x.v.f.cancelScheduledValues(t);
  x.v.f.setValueAtTime(x.v.f.value, t);
  if (on) {
    x.v.f.setTargetAtTime(m.max, t, m.riseTau);
    clearTimeout(x.timer);
  } else {
    x.v.f.setTargetAtTime(m.from - 60, t, m.fallTau);
    clearTimeout(x.timer);
    x.timer = setTimeout(() => { stopVoice(x.v); manual.delete(id); }, m.fallTau * 3400);
  }
}

const $ = (id) => document.getElementById(id);
const res = () => (window.GetParentResourceName ? GetParentResourceName() : 'kavkaz_sgu');
const post = (name, body) => fetch(`https://${res()}/${name}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) }).catch(() => {});
let focus = false;
function panel(d) {
  $('unit').classList.toggle('off', !d.show);
  if (!d.show) return;
  $('kSel').style.setProperty('--a', d.selAngle + 'deg');
  $('kVol').style.setProperty('--a', d.volAngle + 'deg');
  $('l1').classList.toggle('on', !!d.on);
  $('l2').classList.toggle('on', !!d.strobe);
  $('pMan').classList.toggle('on', !!d.man);
  $('c-tone').textContent = d.on ? (d.tones[d.index - 1] || '—') : 'выкл';
  $('c-num').textContent = d.on ? d.index + '/' + d.tones.length : '';
  $('kp').textContent = d.keys.panel || 'X';
  $('kq').textContent = d.keys.quack; $('kt').textContent = d.keys.tone; $('kn').textContent = d.keys.next; $('ks').textContent = d.keys.strobe;
  $('c-strobe').style.display = d.canStrobe ? '' : 'none';
}
let flashT;
function flash(which) {
  const b = $(which === 'next' ? 'pMan' : 'pHorn');
  b.classList.add('on');
  clearTimeout(flashT);
  flashT = setTimeout(() => b.classList.remove('on'), 160);
}
// мышь по пульту (режим X): колесо — ручки, ЛКМ — кнопки, ручной тон — пока держишь
let manHeld = false;
const hotAt = (e) => e.target && e.target.closest ? e.target.closest('.hot') : null;
document.addEventListener('wheel', (e) => {
  if (!focus) return;
  const h = hotAt(e);
  if (!h) return;
  const step = e.deltaY < 0 ? 1 : -1;
  if (h.dataset.hot === 'sel') post('sel', { step });
  else if (h.dataset.hot === 'vol') post('vol', { step });
}, { passive: true });
document.addEventListener('mousedown', (e) => {
  if (!focus) return;
  if (e.button === 2) return post('close');
  if (e.button !== 0) return;
  const h = hotAt(e);
  if (!h) return;
  const k = h.dataset.hot;
  if (k === 'horn') { post('horn'); flash('quack'); }
  else if (k === 'man') { manHeld = true; post('man', { on: true }); }
  else if (k === 'strobe') post('strobe');
  else if (k === 'sel') post('sel', { step: 1 });
});
document.addEventListener('mouseup', () => { if (manHeld) { manHeld = false; post('man', { on: false }); } });
document.addEventListener('contextmenu', (e) => e.preventDefault());
document.addEventListener('keydown', (e) => {
  if (!focus) return;
  if (e.key === 'Escape' || e.key === 'x' || e.key === 'X' || e.key === 'ч' || e.key === 'Ч') post('close');
});

window.addEventListener('message', (e) => {
  const d = e.data || {};
  if (d.action === 'volume') { master.gain.value = Math.max(0, Math.min(1, d.value)); return; }
  if (d.action === 'panel') return panel(d);
  if (d.action === 'flash') return flash(d.which);
  if (d.action === 'focus') { focus = !!d.on; $('unit').classList.toggle('focus', focus); if (!focus && manHeld) { manHeld = false; post('man', { on: false }); } return; }
  if (ctx.state !== 'running') ctx.resume();
  if (d.action === 'quack') quack(d.vol, d.pan || 0);
  if (d.action === 'manual') manualSet(d.id, !!d.on, d.vol || 0, d.pan || 0);
  else if (d.action === 'loop') {
    const l = loops.get(d.id);
    if (l && l.tone !== d.tone) stopLoop(d.id);
    if (!loops.has(d.id)) {
      if (!TONES[d.tone] || d.vol <= 0.005) return;
      startLoop(d.id, d.tone, d.vol, d.pan || 0);
    } else {
      const v = loops.get(d.id).v, now = ctx.currentTime;
      v.c.out.gain.setTargetAtTime(d.vol * BASE, now, 0.06);
      v.c.pan.pan.setTargetAtTime(d.pan || 0, now, 0.06);
    }
  } else if (d.action === 'stop') stopLoop(d.id);
});

// предпросмотр в браузере: index.html?preview — кнопки мелодий
if (location.search.includes('preview')) {
  document.body.style.cssText = 'background:#0f1412;color:#e8efea;font:16px sans-serif;padding:24px';
  const add = (label, fn) => { const b = document.createElement('button'); b.textContent = label; b.style.margin = '4px'; b.onclick = () => { ctx.resume(); fn(); }; document.body.appendChild(b); };
  add('кряк', () => quack(1, 0));
  for (const t of Object.keys(TONES)) add(t, () => { stopLoop(1); startLoop(1, t, 1, 0); });
  add('MAN (держать 2 с)', () => { manualSet('m', true, 1, 0); setTimeout(() => manualSet('m', false, 1, 0), 2000); });
  add('стоп', () => stopLoop(1));
  panel({ show: true, label: 'Хазард 7007 Про', tones: ['«Хазард»', 'Вой', 'Йелп', 'Двухтон', 'Фазер', 'Пульс', 'Горн', 'Кря-кря'], index: 1, on: true, strobe: true, canStrobe: true, selAngle: -103, volAngle: 54, keys: { quack: 'G', tone: 'J', next: 'U', strobe: 'O', panel: 'X' } });
}
</script>
