/* пульт «Хазард 7007» — настоящая фотография блока (unit.png), поверх: поворот ручки, лампы, нажатия */
#unit { position: absolute; right: calc(1.6vw + 12.4rem); bottom: 2.6vh; width: 22rem;
  filter: drop-shadow(0 .5rem .8rem rgba(0,0,0,.65)); transition: opacity .25s, transform .25s; }
#unit.off { opacity: 0; transform: translateY(1rem); }
#unit .photo { position: relative; width: 100%; aspect-ratio: 656 / 358; }
#unit .photo > img { position: absolute; inset: 0; width: 100%; height: 100%; }
#knob { position: absolute; left: 47.561%; top: 16.480%; width: 14.024%; aspect-ratio: 1; border-radius: 50%; overflow: hidden;

#knob img { position: absolute; width: 713.043%; height: auto; left: -339.130%; top: -64.130%; }
.dot { position: absolute; width: 1.1%; aspect-ratio: 1; border-radius: 50%; transform: translate(-50%, -50%);
  background: #ffb12e; box-shadow: 0 0 .5rem .15rem rgba(255,170,40,.85); display: none; }

.led { position: absolute; width: 2.2%; aspect-ratio: 1; border-radius: 50%; transform: translate(-50%, -50%); display: none; }
.led.on { display: block; background: #ff3b30; box-shadow: 0 0 .5rem .2rem rgba(255,59,48,.8); }

.press.on { opacity: 1; }
#cap { margin: .35rem auto 0; width: fit-content; max-width: 100%; padding: .25rem .7rem; border-radius: .4rem;
  background: rgba(10,12,13,.82); border: 1px solid rgba(255,255,255,.1); color: #e9ecee; font-size: .68rem; font-weight: 700;
  white-space: nowrap; display: flex; gap: .55rem; align-items: center; }
#cap b { color: #ffb12e; }
#cap kbd { font-family: inherit; font-size: .65rem; font-weight: 800; padding: .05rem .3rem; border-radius: .25rem;
  background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.18); }
#cap .k { color: #9aa3a8; font-weight: 600; }

    <i class="dot" id="d1" style="left:46.951%;top:24.860%"></i>

    <i class="dot" id="d4" style="left:51.524%;top:48.883%"></i>
    <i class="dot" id="d5" style="left:55.030%;top:48.603%"></i>
    <i class="led amber" id="l1" style="left:79.726%;top:12.849%"></i>
    <i class="led" id="l2" style="left:79.726%;top:36.034%"></i>

  <div id="cap"><span><b id="c-tone">—</b> <span id="c-num"></span></span>
    <span class="k"><kbd id="kq">G</kbd> кряк</span><span class="k"><kbd id="kt">J</kbd> вкл</span>
    <span class="k"><kbd id="kn">U</kbd> дальше</span><span class="k" id="c-strobe"><kbd id="ks">O</kbd> строб</span></div>

<script>
// KAVKAZ RP — звук СГУ «Хазард 7007». всё синтезируется (WebAudio), файлов и чужих записей нет.
// цепочка: генераторы → «рупор» (перегруз + полоса 350–3000 Гц) → громкость → панорама → общий компрессор.
const ctx = new (window.AudioContext || window.webkitAudioContext)();
const BASE = 0.38;

const comp = ctx.createDynamicsCompressor();
comp.threshold.value = -14; comp.ratio.value = 6;
const master = ctx.createGain(); master.gain.value = 1;
comp.connect(master); master.connect(ctx.destination);

function shaperCurve(k) {
  const n = 1024, c = new Float32Array(n);
  for (let i = 0; i < n; i++) { const x = i * 2 / n - 1; c[i] = (1 + k) * x / (1 + k * Math.abs(x)); }
  return c;
}
const CURVE = shaperCurve(9);

function chain(vol, pan, band = 1500) {
  const input = ctx.createGain(); input.gain.value = 0.55;
  const sh = ctx.createWaveShaper(); sh.curve = CURVE;
  const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 350;
  const bp = ctx.createBiquadFilter(); bp.type = 'peaking'; bp.frequency.value = band; bp.gain.value = 6; bp.Q.value = 0.8;
  const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 3200;
  const out = ctx.createGain(); out.gain.value = vol * BASE;
  const p = ctx.createStereoPanner(); p.pan.value = pan;
  input.connect(sh); sh.connect(hp); hp.connect(bp); bp.connect(lp); lp.connect(out); out.connect(p); p.connect(comp);
  return { input, out, pan: p };
}

// генератор: два пилообразных тона с общей частотой (offset) и «воротами» (gate) для прерывистых мелодий
function voice(vol, pan, opts = {}) {
  const c = chain(vol, pan, opts.band);
  const gate = ctx.createGain(); gate.gain.value = 1; gate.connect(c.input);
  const f = ctx.createConstantSource(); f.offset.value = opts.freq || 800;
  const oscs = [];
  for (const d of (opts.detune || [0, 9])) {
    const o = ctx.createOscillator(); o.type = opts.type || 'sawtooth'; o.frequency.value = 0; o.detune.value = d;
    f.connect(o.frequency); o.connect(gate); o.start(); oscs.push(o);
  }
  f.start();
  return { c, gate: gate.gain, f: f.offset, nodes: [f, ...oscs] };
}

function stopVoice(v, t = ctx.currentTime) {
  v.c.out.gain.cancelScheduledValues(t);
  v.c.out.gain.setTargetAtTime(0, t, 0.03);
  for (const n of v.nodes) { try { n.stop(t + 0.2); } catch (e) {} }
}

// один «кряк»: резкий взлёт и падение тона (start — время начала)
function quackShape(v, t, hi = 1800, lo = 560, len = 0.24) {
  v.f.setValueAtTime(hi * 0.9, t);
  v.f.linearRampToValueAtTime(hi, t + 0.02);
  v.f.exponentialRampToValueAtTime(lo, t + len);
  v.gate.setValueAtTime(0, t);
  v.gate.linearRampToValueAtTime(1, t + 0.008);
  v.gate.setValueAtTime(1, t + len - 0.03);
  v.gate.linearRampToValueAtTime(0, t + len);
}

// мелодии: функция расписывает один цикл с момента t и возвращает его длину (с).
// частоты и время сняты с записи настоящего российского СГУ (видео основателя, 11.11.2026, спектр по 10 мс):
//   вой: 505 ↔ 1540 Гц, ~3 с вверх и ~3 с вниз; крякалка (йелп): 650 ↔ 1780 Гц, 0.40 с вверх, 0.42 с вниз;
//   кряк: провал 1000 → 650 → 950 Гц за 0.24 с; гудок: ровный тон 770 Гц; ручной (MAN): 510 → 1250 Гц за 1 с, потолок ~1780.
// крутить звук — здесь: TUNE (выше/ниже — частоты, быстрее/медленнее — времена).
const TUNE = {
  wail: { lo: 505, hi: 1540, up: 3.0, down: 3.0 },
  yelp: { lo: 650, hi: 1780, up: 0.40, down: 0.42 },
  quack: { start: 1000, low: 650, end: 950, len: 0.24 },
  horn: 385,                      // основной тон гудка ×2 = 770 Гц на записи
  manual: { from: 510, max: 1800, riseTau: 1.2, fallTau: 0.6, floor: 520 },
};
// «кряк» как на записи: быстрый провал и возврат
function quackDip(v, t, k = 1) {
  const q = TUNE.quack;
  v.f.setValueAtTime(q.start * k, t);
  v.f.exponentialRampToValueAtTime(q.low * k, t + q.len * 0.5);
  v.f.exponentialRampToValueAtTime(q.end * k, t + q.len);
  v.gate.setValueAtTime(0, t);
  v.gate.linearRampToValueAtTime(1, t + 0.006);
  v.gate.setValueAtTime(1, t + q.len - 0.02);
  v.gate.linearRampToValueAtTime(0, t + q.len);
}
const TONES = {
  wail(v, t) { const w = TUNE.wail; v.gate.setValueAtTime(1, t); v.f.setValueAtTime(w.lo, t); v.f.linearRampToValueAtTime(w.hi, t + w.up); v.f.linearRampToValueAtTime(w.lo, t + w.up + w.down); return w.up + w.down; },
  yelp(v, t) { const y = TUNE.yelp; v.gate.setValueAtTime(1, t); v.f.setValueAtTime(y.lo, t); v.f.linearRampToValueAtTime(y.hi, t + y.up); v.f.linearRampToValueAtTime(y.lo, t + y.up + y.down); return y.up + y.down; },
  phaser(v, t) { v.gate.setValueAtTime(1, t); v.f.setValueAtTime(700, t); v.f.linearRampToValueAtTime(1650, t + 0.09); return 0.1; },
  hilo(v, t) { v.gate.setValueAtTime(1, t); v.f.setValueAtTime(960, t); v.f.setValueAtTime(720, t + 0.55); return 1.1; },
  pulse(v, t) {
    for (let i = 0; i < 4; i++) {
      const s = t + i * 0.2;
      v.f.setValueAtTime(i % 2 ? 1150 : 1300, s);
      v.gate.setValueAtTime(1, s); v.gate.setValueAtTime(0, s + 0.12);
    }
    return 0.8;
  },
  horn(v, t) { v.gate.setValueAtTime(1, t); v.f.setValueAtTime(TUNE.horn, t); return 1.0; },
  // кря-кря: два «кряка» и пауза, как на записи (повтор ~0.75 с)
  krya(v, t) { quackDip(v, t); quackDip(v, t + 0.3); v.gate.setValueAtTime(0, t + 0.56); return 0.75; },
  // фирменная «Хазард»: три коротких кряка и взлёт «уиу»
  hazard(v, t) {
    let s = t;
    for (let i = 0; i < 3; i++) { quackDip(v, s, 1.1); s += 0.19; }
    v.f.setValueAtTime(600, s);
    v.gate.setValueAtTime(1, s);
    v.f.exponentialRampToValueAtTime(1750, s + 0.55);
    v.f.setValueAtTime(1750, s + 0.67);
    v.f.linearRampToValueAtTime(1100, s + 0.77);
    v.gate.setValueAtTime(1, s + 0.75);
    v.gate.linearRampToValueAtTime(0, s + 0.78);
    return (s - t) + 1.08;
  },
};
const OPTS = {
  horn: { type: 'square', detune: [0, 1200, 1902], band: 780 }, // тон, октава (770 Гц) и квинта сверху — «пневма»-гудок
};

const loops = new Map(); // id -> { v, tone, next }

// записи настоящих СГУ: html/sounds/<мелодия>.ogg и quack.ogg. если файла нет — звучит синтез
const SAMPLES = {};
for (const id of ['quack', ...Object.keys(TONES)]) {
  const load = (ext) => fetch('sounds/' + id + '.' + ext).then(r => r.ok ? r.arrayBuffer() : null)
    .then(b => b && ctx.decodeAudioData(b)).then(buf => { if (buf) SAMPLES[id] = buf; return !!buf; }).catch(() => false);
  load('ogg').then(ok => { if (!ok) load('wav'); });
}

function sampleVoice(buf, vol, pan, loop) {
  const out = ctx.createGain(); out.gain.value = vol * BASE * 1.6;
  const p = ctx.createStereoPanner(); p.pan.value = pan;
  const src = ctx.createBufferSource(); src.buffer = buf; src.loop = loop;
  src.connect(out); out.connect(p); p.connect(comp); src.start();
  return { c: { out, pan: p }, nodes: [src], sample: true };
}

function startLoop(id, tone, vol, pan) {
  if (SAMPLES[tone]) { loops.set(id, { v: sampleVoice(SAMPLES[tone], vol, pan, true), tone, next: Infinity }); return; }
  const v = voice(vol, pan, OPTS[tone]);
  v.gate.setValueAtTime(0, ctx.currentTime);
  loops.set(id, { v, tone, next: ctx.currentTime + 0.02 });
}

function stopLoop(id) {
  const l = loops.get(id);
  if (!l) return;
  stopVoice(l.v);
  loops.delete(id);
}

// планировщик: расписываем мелодии на 0.4 с вперёд
setInterval(() => {
  const ahead = ctx.currentTime + 0.4;
  for (const l of loops.values()) {
    let guard = 0;
    if (l.v.sample) continue;
    while (l.next < ahead && guard++ < 64) l.next += TONES[l.tone](l.v, l.next);
  }
}, 60);

function quack(vol, pan) {
  if (SAMPLES.quack) { sampleVoice(SAMPLES.quack, vol, pan, false); return; }
  const v = voice(vol, pan, { freq: 1000 });
  v.gate.setValueAtTime(0, ctx.currentTime);
  const t = ctx.currentTime + 0.01;
  quackDip(v, t);
  for (const n of v.nodes) n.stop(t + 0.4);
}

// ручной режим (кнопка MAN): пока держишь — тон растёт к потолку, отпустил — плавно падает и затихает
const manual = new Map(); // id -> { v, on }
function manualSet(id, on, vol, pan) {
  const m = TUNE.manual;
  const t = ctx.currentTime;
  let x = manual.get(id);
  if (!x) {
    if (!on) return;
    const v = voice(vol, pan, { freq: m.from });
    v.gate.setValueAtTime(1, t);
    x = { v, on: false };
    manual.set(id, x);
  }
  x.v.c.out.gain.setTargetAtTime(vol * BASE, t, 0.05);
  x.v.c.pan.pan.setTargetAtTime(pan, t, 0.05);
  if (on === x.on) return;
  x.on = on;
  x.v.f.cancelScheduledValues(t);
  x.v.f.setValueAtTime(x.v.f.value, t);
  if (on) {
    x.v.f.setTargetAtTime(m.max, t, m.riseTau);
    clearTimeout(x.timer);
  } else {
    x.v.f.setTargetAtTime(m.from - 60, t, m.fallTau);
    clearTimeout(x.timer);
    x.timer = setTimeout(() => { stopVoice(x.v); manual.delete(id); }, m.fallTau * 3400);
  }
}

const $ = (id) => document.getElementById(id);
// углы меток на фото относительно центра ручки (ручка на фото смотрит на HHI, ~222°)
const POS = [217, 191, 170, 147, 123];   // HHI, HI-LO, PHSR, YELP, WAIL
const OFF = 87;                          // STBY — выключено
const KNOB0 = 222;
function panel(d) {
  $('unit').classList.toggle('off', !d.show);
  if (!d.show) return;
  const pos = (d.index - 1) % POS.length;
  const angle = d.on ? POS[pos] : OFF;
  $('knob').style.transform = 'rotate(' + (angle - KNOB0) + 'deg)';
  for (let i = 0; i < 6; i++) $('d' + i).classList.toggle('on', d.on ? i === pos : i === 5);
  $('l1').classList.toggle('on', !!d.on);
  $('l2').classList.toggle('on', !!d.strobe);
  $('c-tone').textContent = d.tones[d.index - 1] || '—';
  $('c-num').textContent = d.index + '/' + d.tones.length + (d.on ? ' ▶' : '');
  $('kq').textContent = d.keys.quack; $('kt').textContent = d.keys.tone; $('kn').textContent = d.keys.next; $('ks').textContent = d.keys.strobe;
  $('c-strobe').style.display = d.canStrobe ? '' : 'none';
}
let flashT;
function flash(which) {
  const b = $(which === 'next' ? 'pMan' : 'pHorn');
  b.classList.add('on');
  clearTimeout(flashT);
  flashT = setTimeout(() => b.classList.remove('on'), 200);
}

window.addEventListener('message', (e) => {
  const d = e.data || {};
  if (d.action === 'volume') { master.gain.value = Math.max(0, Math.min(1, d.value)); return; }
  if (d.action === 'panel') return panel(d);
  if (d.action === 'flash') return flash(d.which);
  if (ctx.state !== 'running') ctx.resume();
  if (d.action === 'quack') quack(d.vol, d.pan || 0);
  if (d.action === 'manual') manualSet(d.id, !!d.on, d.vol || 0, d.pan || 0);
  else if (d.action === 'loop') {
    const l = loops.get(d.id);
    if (l && l.tone !== d.tone) stopLoop(d.id);
    if (!loops.has(d.id)) {
      if (!TONES[d.tone] || d.vol <= 0.005) return;
      startLoop(d.id, d.tone, d.vol, d.pan || 0);
    } else {
      const v = loops.get(d.id).v, now = ctx.currentTime;
      v.c.out.gain.setTargetAtTime(d.vol * BASE, now, 0.06);
      v.c.pan.pan.setTargetAtTime(d.pan || 0, now, 0.06);
    }
  } else if (d.action === 'stop') stopLoop(d.id);
});

// предпросмотр в браузере: index.html?preview — кнопки мелодий
if (location.search.includes('preview')) {
  document.body.style.cssText = 'background:#0f1412;color:#e8efea;font:16px sans-serif;padding:24px';
  const add = (label, fn) => { const b = document.createElement('button'); b.textContent = label; b.style.margin = '4px'; b.onclick = () => { ctx.resume(); fn(); }; document.body.appendChild(b); };
  add('кряк', () => quack(1, 0));
  for (const t of Object.keys(TONES)) add(t, () => { stopLoop(1); startLoop(1, t, 1, 0); });
  add('MAN (держать 2 с)', () => { manualSet('m', true, 1, 0); setTimeout(() => manualSet('m', false, 1, 0), 2000); });
  add('стоп', () => stopLoop(1));
  panel({ show: true, label: 'Хазард 7007 Про', tones: ['«Хазард»', 'Вой', 'Йелп', 'Двухтон', 'Фазер', 'Пульс', 'Горн', 'Кря-кря'], index: 1, on: true, strobe: true, canStrobe: true, keys: { quack: 'G', tone: 'J', next: 'U', strobe: 'O' } });
}
</script>
