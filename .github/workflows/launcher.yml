name: launcher

on:
  push:
    paths:
      - 'launcher/src-tauri/**'
      - 'launcher/ui/**'
      - '.github/workflows/launcher.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher/src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Сборка лаунчера
        working-directory: launcher
        run: npx --yes @tauri-apps/cli@2 build

      - name: Сохранить установщик
        uses: actions/upload-artifact@v4
        with:
          name: KAVKAZ-RP-Launcher
          path: launcher/src-tauri/target/release/bundle/nsis/*.exe

      - name: Обновить релиз «launcher-latest»
        uses: softprops/action-gh-release@v2
        with:
          tag_name: launcher-latest
          name: KAVKAZ RP — лаунчер (тестовая версия)
          prerelease: true
          files: launcher/src-tauri/target/release/bundle/nsis/*.exe
