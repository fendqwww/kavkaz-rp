<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>KAVKAZ RP</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  /* фирменный стиль KAVKAZ: ночной синий, белый курсивный логотип, голубая точка */
  :root {
    --bg: #030b26; --panel: #0a1a4a; --line: rgba(140,200,255,.16);
    --text: #ffffff; --muted: #a9c0e6; --acc: #2ab4ff; --acc-deep: #1478ff;
    --ok: #3ddc84; --bad: #ff5d6c;
    --f-logo: "Montserrat", "Arial Black", sans-serif;
    --f-ui: "Onest", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font: 600 15px/1.45 var(--f-ui); color: var(--text); overflow: hidden; user-select: none;
    background:
      radial-gradient(700px 420px at 78% 18%, rgba(20,120,255,.35), transparent 70%),
      radial-gradient(600px 380px at 10% 110%, rgba(42,180,255,.18), transparent 70%),
      var(--bg);
  }
  .wrap { height: 100%; display: flex; flex-direction: column; padding: 44px 52px 28px; }
  .logo { position: relative; display: inline-block; font: italic 900 92px/1 var(--f-logo); letter-spacing: -.035em;
    text-shadow: 0 0 28px rgba(140,200,255,.55), 0 0 2px #fff; }
  .logo::after { content: ""; position: absolute; right: -16px; top: -6px; width: 26px; height: 26px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #9fe2ff, var(--acc) 55%, #0b74d6); box-shadow: 0 0 18px rgba(42,180,255,.9); }
  .rp { font: italic 900 30px var(--f-logo); color: var(--acc); margin-left: 10px; }
  .tag { margin-top: 14px; font-size: 13px; letter-spacing: .32em; text-transform: uppercase; color: var(--muted); }

  .main { margin-top: auto; display: flex; flex-direction: column; gap: 18px; max-width: 520px; }
  .status { display: inline-flex; align-items: center; gap: 10px; align-self: flex-start; padding: 8px 14px;
    border-radius: 999px; background: rgba(10,26,74,.7); border: 1px solid var(--line); font-size: 14px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
  .dot.ok { background: var(--ok); box-shadow: 0 0 10px var(--ok); }
  .dot.bad { background: var(--bad); }
  .play { align-self: flex-start; border: 0; cursor: pointer; padding: 20px 76px; border-radius: 14px;
    font: 800 22px var(--f-ui); letter-spacing: .12em; color: #fff;
    background: linear-gradient(180deg, var(--acc), var(--acc-deep)); box-shadow: 0 12px 36px rgba(20,120,255,.45);
    transition: filter .12s, transform .12s; }
  .play:hover { filter: brightness(1.08); }
  .play:active { transform: translateY(1px); }
  .play:focus-visible, .btn:focus-visible, input:focus-visible { outline: 2px solid var(--acc); outline-offset: 3px; }
  .play:disabled { cursor: default; filter: grayscale(.7) brightness(.55); box-shadow: none; }
  .hint { color: var(--muted); font-size: 13px; min-height: 19px; }
  .warn { display: none; align-items: center; gap: 14px; padding: 12px 16px; border-radius: 12px;
    background: rgba(255,93,108,.1); border: 1px solid rgba(255,93,108,.35); font-size: 14px; }

  .bottom { margin-top: 28px; display: flex; align-items: flex-end; gap: 10px; flex-wrap: wrap; }
  .btn { cursor: pointer; border: 1px solid var(--line); background: rgba(10,26,74,.6); color: var(--text);
    padding: 9px 16px; border-radius: 10px; font: 600 13px var(--f-ui); }
  .btn:hover { border-color: var(--acc); color: #bfe9ff; }
  .settings { display: none; align-items: center; gap: 8px; }
  .settings.open { display: flex; }
  .settings input { width: 240px; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line);
    background: rgba(3,11,38,.8); color: var(--text); font: 600 13px var(--f-ui); }
  .ver { margin-left: auto; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><span class="logo">KAVKAZ</span><span class="rp">RP</span></div>
    <div class="tag">дорога домой начинается здесь</div>
  </header>

  <section class="main">
    <div class="status"><span class="dot" id="dot"></span><span id="statusText">Проверяю сервер…</span></div>
    <button class="play" id="play" disabled>ИГРАТЬ</button>
    <div class="hint" id="hint"></div>
    <div class="warn" id="fivemWarn">
      <span>FiveM не найден. Без него зайти не получится.</span>
      <button class="btn" id="getFivem">Скачать FiveM</button>
    </div>
  </section>

  <footer class="bottom" id="links">
    <button class="btn" id="settingsBtn">Настройки</button>
    <div class="settings" id="settings">
      <input id="addr" placeholder="адрес сервера, например 185.1.2.3" aria-label="Адрес сервера">
      <button class="btn" id="saveAddr">Сохранить</button>
    </div>
    <span class="ver">лаунчер v0.1</span>
  </footer>
</div>

<script>
  const invoke = window.__TAURI__.core.invoke;
  const $ = (id) => document.getElementById(id);
  let cfg = null;

  function addLink(text, url) {
    if (!url) return;
    const b = document.createElement('button');
    b.className = 'btn'; b.textContent = text;
    b.onclick = () => invoke('open_link', { url });
    $('links').insertBefore(b, $('settingsBtn'));
  }

  async function refreshStatus() {
    if (!cfg || !cfg.address) {
      $('dot').className = 'dot';
      $('statusText').textContent = 'Сервер ещё не подключён';
      $('play').disabled = true;
      return;
    }
    const s = await invoke('get_status', { address: cfg.address });
    $('dot').className = s.online ? 'dot ok' : 'dot bad';
    $('statusText').textContent = s.online ? 'Сервер работает' : 'Сервер сейчас недоступен';
    $('play').disabled = !s.online;
  }

  async function init() {
    cfg = await invoke('get_config');
    addLink('Telegram', cfg.telegram);
    addLink('Сайт', cfg.site);
    $('addr').value = cfg.address_is_custom ? cfg.address : '';
    $('fivemWarn').style.display = (await invoke('fivem_installed')) ? 'none' : 'flex';
    await refreshStatus();
    setInterval(refreshStatus, 15000);
  }

  $('play').onclick = async () => {
    try {
      await invoke('play', { address: cfg.address });
      $('hint').textContent = 'Запускаю FiveM… Первый вход может занять несколько минут.';
    } catch (e) { $('hint').textContent = String(e); }
  };
  $('getFivem').onclick = () => invoke('open_link', { url: 'https://fivem.net/' });
  $('settingsBtn').onclick = () => $('settings').classList.toggle('open');
  $('saveAddr').onclick = async () => {
    try {
      await invoke('set_address', { address: $('addr').value });
      $('hint').textContent = 'Сохранено.';
      cfg = await invoke('get_config');
      await refreshStatus();
    } catch (e) { $('hint').textContent = String(e); }
  };

  init();
</script>
</body>
</html>
