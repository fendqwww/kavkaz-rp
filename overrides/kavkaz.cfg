## KAVKAZ RP — наши настройки сервера.
## подключается последней строкой server.cfg: exec kavkaz.cfg  (это делает setup/apply-overrides)
## секретов здесь нет и быть не должно: пароли — только в secrets.cfg.

# язык: ox_lib / ox_inventory / qbx_* (где есть ru.json) и редактор внешности
setr ox:locale "ru"
setr illenium-appearance:locale "ru"

# акцентный цвет окон ox_lib — изумрудный (палитра Mantine: teal, оттенок 5 = #20c997), как HUD. синий отменён
setr ox:primaryColor "teal"
setr ox:primaryShade 5

# убрать заглушки Qbox: «Welcome to Qbox» в чате, служебное сообщение в консоли, английские входы/выходы, discord.gg/qbox
setr qbx:motd ""
set qbx:acknowledge "true"
set qbx:discordLink ""
set qbx:discordlink ""
setr qb_locale "ru"
set qbx_chat:joinMessage "^2%s зашёл в город"
set qbx_chat:quitMessage "^1%s покинул город (%s)"

# свой экран загрузки вместо стандартного
stop loadscreen
ensure kavkaz_loadscreen

# без меню выбора места появления: новичок — у автовокзала, вернувшийся — где вышел (qbx_core сам)
stop qbx_spawn

# свой HUD и спидометр (км/ч, передачи) вместо qbx_hud
stop qbx_hud
ensure kavkaz_hud

# СГУ «Хазард 7007»: G кряк, J мелодия, U сменить, O стробоскоп; гараж Бислана; служебные СГУ
ensure kavkaz_sgu
ensure kavkaz_air
ensure kavkaz_interact

# меню игрока (F4): профиль, статистика, безопасность, промокод, настройки, помощь
ensure kavkaz_menu

# дома основателей в Вайнвуд-Хиллз (Норт-Конкер 2044 и 2045): гараж со всеми машинами (СГУ «Хазард Про»), деньги один раз
ensure kavkaz_founders

# админка (kavkaz_admin): основатели = все, кто в group.admin (permissions.cfg / рецепт Qbox).
# group.admin выдаём только основателям, остальные админы получают уровень командой /setadmin.
add_ace group.admin kavkaz.founder allow
# второго основателя добавить так (его fivem-id видно в txAdmin → Players):
# add_principal identifier.fivem:12345678 group.admin
# закрытый канал Discord для логов: строка  set kavkaz_admin_webhook "https://discord.com/api/webhooks/..."
# кладётся ТОЛЬКО в C:/kavkaz/secrets.cfg, не сюда.

# наши ресурсы
ensure kavkaz_fixes
ensure kavkaz_start
ensure kavkaz_admin
ensure kavkaz_plates
ensure kavkaz_rp
ensure kavkaz_map
ensure kavkaz_world
# KAVKAZ: бесплатные моды карты (resources/[maps], в git не кладём, на VPS копируются напрямую)
ensure kv_map_border
ensure kv_map_autosalon
ensure kv_map_chaihana
ensure kv_map_lovzar
ensure kv_map_kpp
ensure kv_map_gov
ensure kv_map_russia
ensure kv_map_selo_bolnica
# ensure kv_map_pekarnya  # KAVKAZ: убрано 11.11 — это мод для RedM (game "rdr3", файлы RSC8), в GTA роняет игру при загрузке (GTA5_b3889.exe+16895DB). нужна пекарня для GTA
ensure kv_map_steppe
ensure kv_map_roads
ensure kv_props
ensure kavkaz_replace
ensure kavkaz_food
ensure kavkaz_traffic
ensure kavkaz_fines
ensure kavkaz_quests
# kavkaz_cars здесь не ставим: он стартует раньше qbx_core (строка в server.cfg), повторный ensure его перезапустит
ensure kavkaz_help

# клавиши без конфликтов (меню эмоций scully мешало нашим):
# U у него «упасть» — у нас U мелодия СГУ (персонаж падал и не вставал); G — кряк/меню действий; B — ремень; F5 — навигатор
setr scully_emotemenu:ragdollKey ""
setr scully_emotemenu:ptfxKey ""
setr scully_emotemenu:pointKey ""
setr scully_emotemenu:menuKeybind "F7"
setr scully_emotemenu:handsUpInVehicle "false"
