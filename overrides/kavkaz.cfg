## KAVKAZ RP — наши настройки сервера.
## подключается последней строкой server.cfg: exec kavkaz.cfg  (это делает setup/apply-overrides)
## секретов здесь нет и быть не должно: пароли — только в secrets.cfg.

# язык: ox_lib / ox_inventory / qbx_* (где есть ru.json) и редактор внешности
setr ox:locale "ru"
setr illenium-appearance:locale "ru"

# акцентный цвет окон ox_lib — небесно-синий (палитра Mantine: blue, оттенок 4 = #4dabf7)
setr ox:primaryColor "blue"
setr ox:primaryShade 4

# свой экран загрузки вместо стандартного
stop loadscreen
ensure kavkaz_loadscreen

# админка (kavkaz_admin): основатели = все, кто в group.admin (permissions.cfg / рецепт Qbox).
# group.admin выдаём только основателям, остальные админы получают уровень командой /setadmin.
add_ace group.admin kavkaz.founder allow
# второго основателя добавить так (его fivem-id видно в txAdmin → Players):
# add_principal identifier.fivem:12345678 group.admin
# закрытый канал Discord для логов: строка  set kavkaz_admin_webhook "https://discord.com/api/webhooks/..."
# кладётся ТОЛЬКО в secrets.cfg (VPS: /opt/kavkaz/secrets.cfg, Windows: C:/kavkaz/secrets.cfg), не сюда.

# наши ресурсы
ensure kavkaz_fixes
ensure kavkaz_start
ensure kavkaz_admin
ensure kavkaz_plates
ensure kavkaz_rp
ensure kavkaz_map
ensure kavkaz_fines
ensure kavkaz_quests
# kavkaz_cars здесь не ставим: он стартует раньше qbx_core (строка в server.cfg), повторный ensure его перезапустит
ensure kavkaz_help
